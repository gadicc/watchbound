name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: watchbound-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build:
    name: Source build (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: floor
            node-version: 24.15.0
            node-check-latest: false
            rust-toolchain: 1.88.0
          - lane: moving
            node-version: 24.x
            node-check-latest: true
            rust-toolchain: stable

    steps:
      - name: Check out source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reject checked-in native artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          tracked_native="$(git ls-files -- 'node/*.node' 'node/*.so')"
          test -z "$tracked_native"
          checkout_native="$(find node -maxdepth 1 -type f \( -name '*.node' -o -name '*.so' \) -print -quit)"
          test -z "$checkout_native"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          architecture: x64
          check-latest: ${{ matrix.node-check-latest }}
          package-manager-cache: false

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${{ matrix.rust-toolchain }}" \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup default "${{ matrix.rust-toolchain }}"

      - name: Assert and record target host
        shell: bash
        run: |
          set -euo pipefail

          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(node -p 'process.platform')" = linux
          test "$(node -p 'process.arch')" = x64
          node -e 'if (Number(process.versions.napi) < 6) process.exit(1)'

          glibc_version="$(getconf GNU_LIBC_VERSION)"
          test "$glibc_version" = "glibc 2.39"

          kernel_release="$(uname -r)"
          kernel_version="${kernel_release%%-*}"
          dpkg --compare-versions "$kernel_version" ge 6.8

          command -v cc
          command -v c++
          command -v ld

          uname -a
          printf 'distribution=%s %s\n' "$ID" "$VERSION_ID"
          printf 'glibc=%s\n' "$glibc_version"
          printf 'kernel=%s\n' "$kernel_release"
          cc --version
          c++ --version
          ld --version
          node --version
          printf 'node_api=%s\n' "$(node -p 'process.versions.napi')"
          rustc --version --verbose
          cargo --version

          if test "${{ matrix.lane }}" = floor; then
            test "$(node --version)" = v24.15.0
            rustc --version | grep -Eq '^rustc 1\.88\.0 '
          else
            node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
            rustup show active-toolchain | grep -Eq '^stable-x86_64-unknown-linux-gnu '
          fi

      - name: Enable the pinned pnpm release
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          test "$(pnpm --version)" = 10.33.2

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Build the native binding from source
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --locked >/dev/null
          pnpm build:node
          test -f node/watchbound.linux-x64-gnu.node
          test "$(find node -maxdepth 1 -type f -name '*.node' -print | wc -l)" -eq 1
          test -z "$(find node -maxdepth 1 -type f -name '*.so' -print -quit)"
          file node/watchbound.linux-x64-gnu.node
          git diff --exit-code -- node/index.js node/index.d.ts node/load-native.cjs
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml

      - name: Compile public TypeScript contracts
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run repository checks
        run: pnpm check

      - name: Run bounded maintenance gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:soak
          pnpm test:root-recovery-stress

      - name: Run strict ordinary conformance serially
        shell: bash
        run: |
          set -euo pipefail
          node benches/conformance.mjs \
            --adapter watchbound \
            --scenarios normal-deep-change,moved-in-subtree,root-replacement,root-replacement-recovery,watch-limit,bridge-backpressure,dynamic-exclusions,reconciliation,automatic-reconciliation,burst-files,burst-directories,burst-renames,disposal \
            --quick \
            --order rotating \
            --strict

      - name: Exercise the quick benchmark paths
        shell: bash
        run: |
          set -euo pipefail
          node --expose-gc benches/benchmark.mjs \
            --adapter watchbound \
            --quick \
            --order rotating \
            --strict \
            --output "$RUNNER_TEMP/watchbound-benchmark-smoke.json" \
            --quiet

      - name: Set up Deno for JSR validation
        if: matrix.lane == 'floor'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.6.7

      - name: Validate npm and JSR release artifacts
        if: matrix.lane == 'floor'
        run: pnpm test:packages
