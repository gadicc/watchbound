[workspace]
members = ["engine", "node"]
resolver = "3"

[workspace.package]
version = "0.0.0-development"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
libc = "0.2.183"
napi = { version = "3.10.5", features = ["napi6"] }
napi-derive = "3.5.10"
napi-build = "2.3.2"

[profile.release]
strip = "symbols"
