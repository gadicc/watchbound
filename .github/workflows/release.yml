name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchbound-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Test release source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Release if relevant
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out the release source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          architecture: x64
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Enable the pinned pnpm release
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          test "$(pnpm --version)" = 10.33.2

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.18.0

      - name: Set up Deno for JSR publishing
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.6.7

      - name: Publish a release when Conventional Commits require one
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          WATCHBOUND_REPRODUCIBLE_BUILD: "1"
        run: pnpm release
