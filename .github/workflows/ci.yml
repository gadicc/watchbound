name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact source SHA supplied by the release qualification caller
        required: false
        type: string
      candidate_version:
        description: Version selected by semantic-release for exact release qualification
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: watchbound-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Read native matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.matrix.outputs.source }}
      cross: ${{ steps.matrix.outputs.cross }}
      runtime: ${{ steps.matrix.outputs.runtime }}
      qualification: ${{ steps.matrix.outputs.qualification }}
      kernel: ${{ steps.matrix.outputs.kernel }}
      nix: ${{ steps.matrix.outputs.nix }}
      node-runtime: ${{ steps.matrix.outputs.nodeRuntime }}
      electron-runtime: ${{ steps.matrix.outputs.electronRuntime }}
      build-node: ${{ steps.matrix.outputs.buildNode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: matrix
        run: node scripts/ci-matrix.mjs --github-output "$GITHUB_OUTPUT"

  source-build:
    name: Source and semantic suite (${{ matrix.target }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.source) }}
    steps:
      - name: Check out the exact clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reject checked-in native artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha || github.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files -- 'node/*.node' 'node/*.so')"
          test -z "$(find node -maxdepth 1 -type f \( -name '*.node' -o -name '*.so' \) -print -quit)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - name: Set up pinned Rust and pnpm
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.88.0
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          test "$(node --version)" = "v${{ needs.matrix.outputs.build-node }}"
          test "$(node -p 'process.arch')" = "${{ matrix.architecture }}"
          rustc --version | grep -Eq '^rustc 1\.88\.0 '
          test "$(pnpm --version)" = 10.33.2
      - name: Assert and record the native baseline host
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 22.04
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
          test "$(uname -s)" = Linux
          case "${{ matrix.architecture }}" in
            x64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
          esac
          command -v cc
          command -v c++
          command -v ld
          uname -a
          getconf GNU_LIBC_VERSION
          rustc --version --verbose
          node -p 'JSON.stringify(process.versions)'
      - name: Install, build, and verify the repository
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build:node
          test -f "node/${{ matrix.binary }}"
          test "$(find node -maxdepth 1 -type f -name '*.node' -print | wc -l)" -eq 1
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          else
            git diff --exit-code -- Cargo.lock pnpm-lock.yaml node/index.js node/index.d.ts node/load-native.cjs
          fi
          pnpm test
          pnpm check
          pnpm test:soak
          pnpm test:root-recovery-stress
          node benches/conformance.mjs \
            --adapter watchbound \
            --scenarios normal-deep-change,moved-in-subtree,root-replacement,root-replacement-recovery,watch-limit,bridge-backpressure,dynamic-exclusions,reconciliation,automatic-reconciliation,burst-files,burst-directories,burst-renames,disposal \
            --quick --order rotating --strict
          node --expose-gc benches/benchmark.mjs \
            --adapter watchbound --quick --order rotating --strict \
            --output "$RUNNER_TEMP/watchbound-benchmark-smoke.json" --quiet
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.6.7
      - name: Rehearse npm and JSR artifacts offline
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:packages
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          fi
      - name: Retain the target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchbound-ci-native-${{ matrix.target }}
          path: node/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  cross-build:
    name: Cross-build and package (${{ matrix.target }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.cross) }}
    steps:
      - name: Check out the exact clean source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - name: Install the pinned ARMv7 hard-float cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-arm-linux-gnueabihf gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.88.0
          rustup target add "${{ matrix.rustTarget }}"
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          test "$(node --version)" = "v${{ needs.matrix.outputs.build-node }}"
          test "$(node -p 'process.arch')" = x64
          "${{ matrix.linker }}" --version
      - name: Cross-compile and validate the exact target package
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node scripts/build-node.mjs --target "${{ matrix.target }}"
          test -f "node/${{ matrix.binary }}"
          test "$(find node -maxdepth 1 -type f -name '*.node' -print | wc -l)" -eq 1
          file "node/${{ matrix.binary }}" | grep -F 'ELF 32-bit LSB shared object, ARM'
          readelf --file-header "node/${{ matrix.binary }}" | grep -Eq 'Machine:[[:space:]]+ARM'
          pnpm package:prepare
          node scripts/check-target-package.mjs --target "${{ matrix.target }}"
          node node/test/loader.cjs
          node js/test/package-contract.test.js
          pnpm check
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          fi
      - name: Retain the cross-built target artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchbound-ci-native-${{ matrix.target }}
          path: node/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  node-runtime-compatibility:
    name: Node ${{ matrix.nodeVersion }} ${{ matrix.architecture }} (${{ matrix.coverage }})
    needs: [matrix, source-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.node-runtime) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - name: Prepare packages around the one retained native artifact
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watchbound-ci-native-${{ matrix.target }}
          path: node
      - shell: bash
        run: |
          set -euo pipefail
          retained_native_sha256="$(sha256sum "node/${{ matrix.binary }}" | cut -d ' ' -f 1)"
          echo "WATCHBOUND_RETAINED_NATIVE_SHA256=$retained_native_sha256" >> "$GITHUB_ENV"
          pnpm package:prepare
          node scripts/pack-prepared-packages.mjs --target "${{ matrix.target }}"
          sha256sum "node/${{ matrix.binary }}"
      - name: Select the runtime under test without rebuilding the addon
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.nodeVersion }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Exercise loader admission or the full installed lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${{ matrix.nodeVersion }}"
          test "$(node -p 'process.arch')" = "${{ matrix.architecture }}"
          node scripts/check-node-runtime.mjs \
            --target "${{ matrix.target }}" \
            --version "${{ matrix.nodeVersion }}" \
            --coverage "${{ matrix.coverage }}" \
            --native-sha256 "$WATCHBOUND_RETAINED_NATIVE_SHA256" \
            --evidence "$RUNNER_TEMP/watchbound-node-${{ matrix.nodeVersion }}-${{ matrix.architecture }}.json"
      - if: always() && matrix.coverage == 'full-lifecycle'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchbound-node-${{ matrix.nodeVersion }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/watchbound-node-${{ matrix.nodeVersion }}-${{ matrix.architecture }}.json
          if-no-files-found: warn
          retention-days: 90

  electron-runtime-compatibility:
    name: Electron ${{ matrix.electron }} / Node ${{ matrix.node }} (${{ matrix.runtime }})
    needs: [matrix, source-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.electron-runtime) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - name: Prepare packages around the one retained native artifact
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watchbound-ci-native-${{ matrix.target }}
          path: node
      - name: Exercise the exact addon through the pinned Electron archive
        shell: bash
        run: |
          set -euo pipefail
          retained_native_sha256="$(sha256sum "node/${{ matrix.binary }}" | cut -d ' ' -f 1)"
          pnpm package:prepare
          archive="$RUNNER_TEMP/electron-${{ matrix.electron }}.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/electron/electron/releases/download/v${{ matrix.electron }}/electron-v${{ matrix.electron }}-linux-${{ matrix.electronArchitecture }}.zip"
          printf '%s  %s\n' '${{ matrix.electronSha256 }}' "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/electron-${{ matrix.electron }}"
          unzip -q "$archive" -d "$RUNNER_TEMP/electron-${{ matrix.electron }}"
          node scripts/check-electron-asar.mjs \
            --electron "$RUNNER_TEMP/electron-${{ matrix.electron }}/electron" \
            --target "${{ matrix.target }}" \
            --runtime "${{ matrix.runtime }}" \
            --native-sha256 "$retained_native_sha256" \
            --evidence "$RUNNER_TEMP/watchbound-electron-${{ matrix.runtime }}.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchbound-electron-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/watchbound-electron-${{ matrix.runtime }}.json
          if-no-files-found: warn
          retention-days: 90

  armv7-runtime:
    name: QEMU ARMv7 Electron lifecycle (${{ matrix.target }})
    needs: [matrix, cross-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.runtime) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - name: Install QEMU user mode
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            qemu-user unzip
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watchbound-ci-native-${{ matrix.target }}
          path: node
      - name: Configure pinned ARM container emulation
        run: docker run --privileged --rm "${{ matrix.binfmtImage }}" --install arm
      - name: Prepare the pinned Ubuntu ARMHF runtime rootfs
        run: |
          node scripts/prepare-armhf-runtime.mjs \
            --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/watchbound-armhf-rootfs-${{ matrix.target }}" \
            --evidence "$RUNNER_TEMP/watchbound-armhf-rootfs-${{ matrix.target }}.json"
      - name: Load, watch, deliver, and dispose under ARMv7 Electron
        shell: bash
        run: |
          set -euo pipefail
          pnpm package:prepare
          archive="$RUNNER_TEMP/electron-armv7.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/electron/electron/releases/download/v42.3.0/electron-v42.3.0-linux-${{ matrix.electronArchitecture }}.zip"
          expected_hex="$(printf '%s' '${{ matrix.electronSha256SRI }}' | sed 's/^sha256-//' | base64 -d | od -An -vtx1 | tr -d ' \n')"
          printf '%s  %s\n' "$expected_hex" "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/electron-armv7"
          unzip -q "$archive" -d "$RUNNER_TEMP/electron-armv7"
          node scripts/check-electron-asar.mjs \
            --electron "$RUNNER_TEMP/electron-armv7/electron" \
            --emulator "${{ matrix.emulator }}" \
            --emulator-cpu "${{ matrix.emulatorCpu }}" \
            --rootfs "$RUNNER_TEMP/watchbound-armhf-rootfs-${{ matrix.target }}" \
            --target "${{ matrix.target }}" \
            --evidence "$RUNNER_TEMP/watchbound-armv7-runtime-${{ matrix.target }}.json"
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchbound-armv7-runtime-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/watchbound-armhf-rootfs-${{ matrix.target }}.json
            ${{ runner.temp }}/watchbound-armv7-runtime-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 90

  moving-toolchain:
    name: Moving Node 24 and Rust stable
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          architecture: x64
          check-latest: true
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - name: Exercise the moving supported tool range
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
          pnpm build:node
          pnpm test
          pnpm check
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          fi

  distro-qualification:
    name: Runtime ABI (${{ matrix.lane }}, ${{ matrix.architecture }})
    needs: [matrix, source-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.qualification) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watchbound-ci-native-${{ matrix.target }}
          path: node
      - name: Prepare exact local tarballs
        run: |
          pnpm package:prepare
          node scripts/pack-prepared-packages.mjs --target "${{ matrix.target }}"
      - name: Exercise offline installation in the pinned distro image
        shell: bash
        run: |
          set -euo pipefail
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker pull "${{ matrix.image }}"
          node scripts/run-distro-qualification.mjs \
            --lane "${{ matrix.lane }}" \
            --target "${{ matrix.target }}" \
            --image "${{ matrix.image }}" \
            --node-root "$node_root" \
            --evidence "$RUNNER_TEMP/watchbound-${{ matrix.lane }}-${{ matrix.architecture }}.json"
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchbound-distro-${{ matrix.lane }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/watchbound-${{ matrix.lane }}-${{ matrix.architecture }}.json
          if-no-files-found: warn
          retention-days: 90

  kernel-baseline:
    name: Kernel 5.15 (${{ matrix.target }}, QEMU component)
    needs: [matrix, source-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.kernel) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - name: Install the architecture-native QEMU system emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "${{ matrix.qemuPackage }}" e2fsprogs unzip
      - run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watchbound-ci-native-${{ matrix.target }}
          path: node
      - if: matrix.targetArchitecture == 'arm'
        name: Configure pinned ARM container emulation
        run: docker run --privileged --rm "${{ matrix.binfmtImage }}" --install arm
      - if: matrix.targetArchitecture == 'arm'
        name: Prepare the pinned ARMHF kernel rootfs
        run: |
          node scripts/prepare-armhf-runtime.mjs \
            --target "${{ matrix.target }}" \
            --profile kernel \
            --output "$RUNNER_TEMP/watchbound-armhf-kernel-rootfs-${{ matrix.target }}" \
            --evidence "$RUNNER_TEMP/watchbound-armhf-kernel-rootfs-${{ matrix.target }}.json"
      - name: Exercise the exact package on a real pinned 5.15 kernel
        shell: bash
        run: |
          set -euo pipefail
          pnpm package:prepare
          node scripts/pack-prepared-packages.mjs --target "${{ matrix.target }}"
          extra_args=()
          if [[ "${{ matrix.targetArchitecture }}" == "arm" ]]; then
            archive="$RUNNER_TEMP/kernel-electron-armv7.zip"
            curl --fail --location --retry 3 --output "$archive" \
              "https://github.com/electron/electron/releases/download/v42.3.0/electron-v42.3.0-linux-${{ matrix.electronArchitecture }}.zip"
            expected_hex="$(printf '%s' '${{ matrix.electronSha256SRI }}' | sed 's/^sha256-//' | base64 -d | od -An -vtx1 | tr -d ' \n')"
            printf '%s  %s\n' "$expected_hex" "$archive" | sha256sum --check --strict
            node_root="$RUNNER_TEMP/kernel-electron-node-armv7"
            mkdir -p "$node_root/bin"
            unzip -q "$archive" -d "$node_root"
            ln -s ../electron "$node_root/bin/node"
            host_node_root="$(dirname "$(dirname "$(command -v node)")")"
            mkdir -p "$node_root/lib/node_modules"
            cp -a "$host_node_root/lib/node_modules/npm" "$node_root/lib/node_modules/npm"
            extra_args+=(
              --prepared-rootfs
              "$RUNNER_TEMP/watchbound-armhf-kernel-rootfs-${{ matrix.target }}"
            )
          else
            node_root="$(dirname "$(dirname "$(command -v node)")")"
          fi
          node scripts/run-kernel-baseline-qualification.mjs \
            --target "${{ matrix.target }}" \
            --image "${{ matrix.image }}" \
            --node-root "$node_root" \
            --evidence "$RUNNER_TEMP/watchbound-kernel-${{ matrix.target }}.json" \
            "${extra_args[@]}"
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchbound-kernel-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/watchbound-armhf-kernel-rootfs-${{ matrix.target }}.json
            ${{ runner.temp }}/watchbound-kernel-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 90

  codex-electron-asar:
    name: Codex Electron ASAR (${{ matrix.target }})
    needs: [matrix, source-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.source) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watchbound-ci-native-${{ matrix.target }}
          path: node
      - name: Prepare the target package and exact Electron archive
        shell: bash
        run: |
          set -euo pipefail
          pnpm package:prepare
          archive="$RUNNER_TEMP/electron.zip"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/electron/electron/releases/download/v42.3.0/electron-v42.3.0-linux-${{ matrix.electronArchitecture }}.zip"
          expected_hex="$(printf '%s' '${{ matrix.electronSha256SRI }}' | sed 's/^sha256-//' | base64 -d | od -An -vtx1 | tr -d ' \n')"
          printf '%s  %s\n' "$expected_hex" "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/electron"
          unzip -q "$archive" -d "$RUNNER_TEMP/electron"
          node scripts/check-electron-asar.mjs \
            --electron "$RUNNER_TEMP/electron/electron" \
            --target "${{ matrix.target }}" \
            --evidence "$RUNNER_TEMP/watchbound-electron-${{ matrix.target }}.json"
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchbound-electron-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/watchbound-electron-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 90

  nix:
    name: Nix closure (${{ matrix.system }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.nix) }}
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.matrix.outputs.build-node }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - if: inputs.candidate_version != ''
        uses: ./.github/actions/materialize-release-candidate
        with:
          source-sha: ${{ inputs.candidate_sha }}
          version: ${{ inputs.candidate_version }}
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Build and exercise the locked source closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"
          nix flake check --no-update-lock-file --print-build-logs
          if [[ -n "${{ inputs.candidate_version }}" ]]; then
            node scripts/verify-release-candidate.mjs \
              --source-sha "${{ inputs.candidate_sha }}" \
              --version "${{ inputs.candidate_version }}"
          fi
