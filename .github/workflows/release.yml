name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact lowercase 40-character candidate commit SHA
        required: true
        type: string
      scenario:
        description: Run exactly one forced-overflow qualification scenario
        required: true
        type: choice
        options:
          - overflow-reconciliation
          - automatic-overflow-reconciliation
      attempt:
        description: Positive scenario attempt; retries require a reviewed new dispatch
        required: true
        type: string
      acknowledgement:
        description: Type I ACKNOWLEDGE FORCED OVERFLOW <scenario> ATTEMPT <n>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: watchbound-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plan:
    name: Plan exact release candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # semantic-release verifies push access even when dryRun is enabled.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact clean candidate
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: x64
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/plan-release.mjs
          --mode release
          --output "$RUNNER_TEMP/release-plan.json"
          --github-output "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchbound-release-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error
          retention-days: 90

  qualification-plan:
    name: Plan exact read-only qualification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: x64
          package-manager-cache: false
      - name: Validate one-shot forced-overflow approval
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          SCENARIO: ${{ inputs.scenario }}
          ATTEMPT: ${{ inputs.attempt }}
          ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node scripts/validate-overflow-dispatch.mjs \
            --candidate-sha "$CANDIDATE_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --checked-out-sha "$(git rev-parse HEAD)" \
            --scenario "$SCENARIO" \
            --attempt "$ATTEMPT" \
            --run-attempt "$RUN_ATTEMPT" \
            --acknowledgement "$ACKNOWLEDGEMENT" \
            --output "$RUNNER_TEMP/qualification-dispatch.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - id: plan
        run: >-
          node scripts/plan-release.mjs
          --mode qualification
          --output "$RUNNER_TEMP/qualification-plan.json"
          --github-output "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchbound-qualification-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualification-dispatch.json
            ${{ runner.temp }}/qualification-plan.json
          if-no-files-found: warn
          retention-days: 90

  plan:
    name: Select exact candidate plan
    needs: [release-plan, qualification-plan]
    if: >-
      always() &&
      (needs.release-plan.result == 'success' ||
      needs.qualification-plan.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      qualify: ${{ steps.select.outputs.qualify }}
      will-release: ${{ steps.select.outputs.will-release }}
      version: ${{ steps.select.outputs.version }}
      source-sha: ${{ steps.select.outputs.source-sha }}
      tag: ${{ steps.select.outputs.tag }}
      source: ${{ steps.matrix.outputs.source }}
      build: ${{ steps.matrix.outputs.build }}
      qualification: ${{ steps.matrix.outputs.qualification }}
      registry: ${{ steps.matrix.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: x64
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('watchbound-qualification-plan-{0}-{1}', github.run_id, github.run_attempt) || format('watchbound-release-plan-{0}', github.run_attempt) }}
          path: ${{ runner.temp }}/selected-plan
      - id: matrix
        run: node scripts/ci-matrix.mjs --github-output "$GITHUB_OUTPUT"
      - id: select
        env:
          PLAN_MODE: ${{ github.event_name == 'workflow_dispatch' && 'qualification' || 'release' }}
        run: >-
          node scripts/select-release-plan.mjs
          --mode "$PLAN_MODE"
          --input "$RUNNER_TEMP/selected-plan/$PLAN_MODE-plan.json"
          --github-output "$GITHUB_OUTPUT"

  tests:
    name: Qualify exact release source
    needs: plan
    if: github.event_name == 'push' || needs.plan.outputs.qualify == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.plan.outputs.source-sha }}
    permissions:
      contents: read

  repro-build:
    name: Reproduce ${{ matrix.target }} (${{ matrix.builder }})
    needs: plan
    if: needs.plan.outputs.qualify == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    env:
      CARGO_INCREMENTAL: "0"
      SOURCE_DATE_EPOCH: "0"
      TZ: UTC
    steps:
      - name: Configure isolated builder homes
        shell: bash
        run: |
          set -euo pipefail
          builder="${{ matrix.target }}-${{ matrix.builder }}"
          cargo_home="$RUNNER_TEMP/$builder-cargo-home"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/$builder-target" >> "$GITHUB_ENV"
          echo "COREPACK_HOME=$RUNNER_TEMP/$builder-corepack" >> "$GITHUB_ENV"
          echo "PNPM_STORE_DIR=$RUNNER_TEMP/$builder-pnpm-store" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$cargo_home=/watchbound/cargo-home" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/$builder-rustup" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Assert exact isolated clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.plan.outputs.source-sha }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(find node -maxdepth 1 -type f \( -name '*.node' -o -name '*.so' \) -print -quit)"
      - name: Build in the isolated pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm config set store-dir "$PNPM_STORE_DIR"
          pnpm install --frozen-lockfile
          pnpm build:node
          test -f "node/${{ matrix.binary }}"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"
          test "$(node --version)" = v24.15.0
          test "$(node -p 'process.arch')" = "${{ matrix.architecture }}"
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - name: Record exact build identity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/evidence"
          mkdir -p "$root"
          node scripts/record-native-build.mjs \
            --builder "${{ matrix.builder }}" \
            --target "${{ matrix.target }}" \
            --output "$root/build-manifest.json"
          cp "node/${{ matrix.binary }}" "$root/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchbound-native-${{ matrix.target }}-${{ matrix.builder }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 90

  repro-compare:
    name: Compare independent ${{ matrix.target }} outputs
    needs: [plan, repro-build]
    if: needs.plan.outputs.qualify == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.source) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchbound-native-${{ matrix.target }}-builder-a-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builder-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchbound-native-${{ matrix.target }}-builder-b-${{ github.run_attempt }}
          path: ${{ runner.temp }}/builder-b
      - name: Byte-compare exact target outputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compare-native-builds.mjs \
            --left "$RUNNER_TEMP/builder-a/build-manifest.json" \
            --right "$RUNNER_TEMP/builder-b/build-manifest.json" \
            --target "${{ matrix.target }}" \
            --output "$RUNNER_TEMP/approved/${{ matrix.target }}"
          touch "$RUNNER_TEMP/approved/${{ matrix.target }}.root"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchbound-approved-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate reproducible target matrix
    needs: [plan, repro-compare]
    if: needs.plan.outputs.qualify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native-matrix: ${{ steps.aggregate.outputs.native-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: watchbound-approved-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-input
          merge-multiple: true
      - id: aggregate
        run: >-
          node scripts/aggregate-native-builds.mjs
          --input "$RUNNER_TEMP/approved-input"
          --output "$RUNNER_TEMP/approved-matrix"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchbound-approved-native-matrix-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-matrix
          if-no-files-found: error
          retention-days: 90

  release-distro:
    name: Release artifact ABI (${{ matrix.lane }}, ${{ matrix.architecture }})
    needs: [plan, aggregate]
    if: needs.plan.outputs.qualify == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.qualification) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchbound-approved-native-matrix-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-matrix
      - name: Package and exercise the canonical target
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/approved-matrix/${{ matrix.binary }}" node/
          WATCHBOUND_NATIVE_ARTIFACTS_DIR="$RUNNER_TEMP/approved-matrix" pnpm package:prepare
          node scripts/pack-prepared-packages.mjs --target "${{ matrix.target }}"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker pull "${{ matrix.image }}"
          node scripts/run-distro-qualification.mjs \
            --lane "${{ matrix.lane }}" --target "${{ matrix.target }}" \
            --image "${{ matrix.image }}" --node-root "$node_root" \
            --evidence "$RUNNER_TEMP/release-${{ matrix.lane }}-${{ matrix.architecture }}.json"

  release-electron:
    name: Release Codex Electron (${{ matrix.target }})
    needs: [plan, aggregate]
    if: needs.plan.outputs.qualify == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.source) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchbound-approved-native-matrix-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-matrix
      - name: Exercise canonical package through app.asar.unpacked
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/approved-matrix/${{ matrix.binary }}" node/
          WATCHBOUND_NATIVE_ARTIFACTS_DIR="$RUNNER_TEMP/approved-matrix" pnpm package:prepare
          archive="$RUNNER_TEMP/electron.zip"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/electron/electron/releases/download/v42.3.0/electron-v42.3.0-linux-${{ matrix.electronArchitecture }}.zip"
          expected_hex="$(printf '%s' '${{ matrix.electronSha256SRI }}' | sed 's/^sha256-//' | base64 -d | od -An -vtx1 | tr -d ' \n')"
          printf '%s  %s\n' "$expected_hex" "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/electron"
          unzip -q "$archive" -d "$RUNNER_TEMP/electron"
          node scripts/check-electron-asar.mjs \
            --electron "$RUNNER_TEMP/electron/electron" \
            --target "${{ matrix.target }}" \
            --evidence "$RUNNER_TEMP/release-electron-${{ matrix.target }}.json"

  release-overflow:
    name: Supervised overflow gate (${{ matrix.target }})
    needs: [plan, aggregate]
    if: needs.plan.outputs.qualify == 'true'
    runs-on: ${{ matrix.overflowRunner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.source) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchbound-approved-native-matrix-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-matrix
      - name: Record preflight and run the approved overflow scenario
        shell: bash
        env:
          QUALIFICATION_SCENARIOS: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'overflow-reconciliation,automatic-overflow-reconciliation' }}
          QUALIFICATION_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.attempt || github.run_attempt }}
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/release-overflow-${{ matrix.target }}"
          mkdir -p "$evidence_root"
          cp "$RUNNER_TEMP/approved-matrix/${{ matrix.binary }}" node/
          IFS=',' read -r -a scenarios <<< "$QUALIFICATION_SCENARIOS"
          for scenario in "${scenarios[@]}"; do
            scenario_root="$evidence_root/$scenario"
            report="$scenario_root/conformance.json"
            mkdir -p "$scenario_root"
            node scripts/record-overflow-preflight.mjs \
              --canonical-dir "$RUNNER_TEMP/approved-matrix" \
              --target "${{ matrix.target }}" \
              --scenario "$scenario" \
              --attempt "$QUALIFICATION_ATTEMPT" \
              --report "$report" \
              --output "$scenario_root/preflight.json"
            node benches/conformance.mjs \
              --adapter watchbound \
              --scenario "$scenario" \
              --runs 1 \
              --allow-forced-overflow --strict --pretty \
              --output "$report" --quiet
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchbound-release-overflow-${{ matrix.target }}-${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'release-suite' }}-attempt-${{ github.event_name == 'workflow_dispatch' && inputs.attempt || github.run_attempt }}
          path: ${{ runner.temp }}/release-overflow-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 90

  qualification-verified:
    name: Manual qualification verified
    needs: [plan, tests, aggregate, release-distro, release-electron, release-overflow]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CANDIDATE_SHA: ${{ needs.plan.outputs.source-sha }}
          SCENARIO: ${{ inputs.scenario }}
          ATTEMPT: ${{ inputs.attempt }}
        run: >-
          echo "Qualified $CANDIDATE_SHA $SCENARIO attempt $ATTEMPT
          on native x64 and ARM64."

  release:
    name: Publish exact qualified target matrix
    needs: [plan, tests, aggregate, release-distro, release-electron, release-overflow]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.will-release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.published.outputs.published }}
      version: ${{ steps.published.outputs.version }}
      native-matrix: ${{ needs.aggregate.outputs.native-matrix }}
    env:
      CARGO_INCREMENTAL: "0"
      SOURCE_DATE_EPOCH: "0"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchbound-approved-native-matrix-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-matrix
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: x64
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set up exact release tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          cargo_home="${CARGO_HOME:-/opt/hostedtoolcache/cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=$cargo_home=/watchbound/cargo-home" >> "$GITHUB_ENV"
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
          npm install --global npm@11.18.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.6.7
      - name: Publish only after every exact-artifact gate passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          WATCHBOUND_CANONICAL_NATIVE_DIR: ${{ runner.temp }}/approved-matrix
          WATCHBOUND_PLANNED_VERSION: ${{ needs.plan.outputs.version }}
          WATCHBOUND_REPRODUCIBLE_OUTPUT: ${{ runner.temp }}/same-runner-reproducibility.json
        run: pnpm release
      - id: published
        run: |
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.plan.outputs.version }}" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchbound-release-evidence-${{ github.run_attempt }}
          path: dist/evidence
          if-no-files-found: warn
          retention-days: 90

  registry-smoke:
    name: Registry (${{ matrix.route }}, ${{ matrix.target }})
    needs: [plan, release]
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.registry) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: watchbound-approved-native-matrix-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-matrix
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false
      - name: Install and exercise exact immutable registry packages
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          npm install --global npm@11.18.0
          digest="$(sha256sum "$RUNNER_TEMP/approved-matrix/${{ matrix.binary }}" | cut -d ' ' -f 1)"
          node scripts/check-registry-packages.mjs \
            --route "${{ matrix.route }}" \
            --version "${{ needs.release.outputs.version }}" \
            --native-target "${{ matrix.target }}" \
            --native-sha256 "$digest" \
            --evidence "$RUNNER_TEMP/registry-${{ matrix.route }}-${{ matrix.target }}.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: watchbound-registry-${{ matrix.route }}-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-${{ matrix.route }}-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 90

  verified:
    name: Stable target matrix verified
    needs: registry-smoke
    if: needs.registry-smoke.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Every exact npm and JSR target route passed."
